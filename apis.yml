aid: hvmn
name: HVMN
description: >-
  HVMN (Health Via Modern Nutrition), now operating as Ketone-IQ, is an
  a16z-backed human-performance nutrition company founded by Geoffrey Woo and
  Michael Brandt. It pioneered exogenous ketone products, including the
  Ketone-IQ drinkable ketone shot and ketone ester, sold direct-to-consumer
  through its Shopify-powered online store at ketone.com (hvmn.com now redirects
  to ketone.com). The storefront is agent-native: it publishes /llms.txt and
  /agents.md agent instructions and implements the Universal Commerce Protocol
  (UCP) with a live MCP endpoint for agent-driven catalog search, cart, and
  buyer-approved checkout, backed by Shopify Customer Account OAuth 2.0 / OpenID
  Connect authentication.
